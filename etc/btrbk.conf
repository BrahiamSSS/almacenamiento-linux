# btrbk: snapshots diarios de @ y @home del disco del sistema, enviados al disco de datos.
# Requiere montar la raíz btrfs del sistema (subvolid=5) en /mnt/btr_pool (ver fstab.ejemplo).
# Ajusta "target" a tu $DATOS_DIR/btrbk.
timestamp_format        long

# En el disco del sistema solo 2 días (snapper ya cubre el rollback local)
snapshot_preserve_min   2d
snapshot_preserve       2d

# En el disco de datos: 14 diarios, 8 semanales, 6 mensuales
target_preserve_min     no
target_preserve         14d 8w 6m

volume /mnt/btr_pool
  snapshot_dir @btrbk_snaps
  target /mnt/datos/btrbk
  subvolume @
  subvolume @home
